<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>lab · comments demo</title>
<style>
  @font-face { font-family: 'lab-inter'; src: url('/_lab/fonts/inter-latin-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'lab-inter'; src: url('/_lab/fonts/inter-latin-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #111; font: 400 17px/1.5 'lab-inter', system-ui, sans-serif; }
  nav { max-width: 1200px; margin: 0 auto; padding: 22px 16px; display: flex; align-items: center; gap: 28px; font-size: 15px; color: #555; }
  nav b { color: #111; font-weight: 500; margin-right: auto; font-size: 17px; }
  main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 120px; }
  h1 { font-weight: 500; font-size: clamp(36px, 4.6vw, 56px); line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 14px; max-width: 20ch; }
  p.lead { color: #5b5b5b; max-width: 560px; margin: 0 0 22px; }
  .cta { display: flex; gap: 10px; margin-bottom: 36px; }
  .cta a { padding: 11px 18px; border-radius: 999px; text-decoration: none; font-size: 15px; font-weight: 500; }
  .cta .p { background: #111; color: #fff; } .cta .s { color: #111; box-shadow: inset 0 0 0 1px #ddd; }
  figure { margin: 0 0 16px; }
  img { display: block; width: 100%; height: auto; border-radius: 14px; background: #f4f4f5; box-shadow: 0 0 0 1px #ececee; }
  h2 { font-weight: 500; font-size: 15px; margin: 14px 0 2px; } .grid p { margin: 0; color: #6b6b6b; font-size: 15px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } nav span { display: none; } }
</style>
</head>
<body>
<nav><b>acme</b><span>product</span><span>pricing</span><span>docs</span></nav>
<main>
  <section data-lab="hero">
    <h1>Ship the page. Collect the feedback.</h1>
    <p class="lead">a test page for the lab comment layer. tap "comments" or press <b>c</b> to turn comments on, then click anywhere to pin feedback or drag to mark an area.</p>
    <div class="cta"><a class="p" href="#">get started</a><a class="s" href="#">see pricing</a></div>
    <figure><img src="/_lab/demo-img/hero.jpg" width="1600" height="900" alt="app dashboard"></figure>
  </section>
  <div class="grid" data-lab="cards">
    <figure><img src="/_lab/demo-img/card-signup.jpg" width="1200" height="800" alt="sign-up card"><h2>sign up</h2><p>one field, one button.</p></figure>
    <figure><img src="/_lab/demo-img/card-pricing.jpg" width="1200" height="800" alt="pricing card"><h2>pricing</h2><p>two plans, no surprises.</p></figure>
  </div>
</main>
<script src="/_lab/comments.js" defer></script>
</body>
</html>
