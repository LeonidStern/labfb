<style>

    <h2>Code</h2>
    <figure style="margin:0"><pre><code>// Button styles used across the site.
export type Variant = &#x27;primary&#x27; | &#x27;ghost&#x27;;

  fontFamily: &#x27;Inter, system-ui, sans-serif&#x27;,
  fontSize: 15,
  lineHeight: 1.2,
};

export const variants: Record&lt;Variant, object&gt; = {
  primary: {
    background: &#x27;#111&#x27;,
    color: &#x27;#fff&#x27;,
    padding: &#x27;10px 18px&#x27;,
    borderRadius: 999,
  },
  ghost: {
    background: &#x27;transparent&#x27;,
    color: &#x27;#111&#x27;,
    padding: &#x27;10px 18px&#x27;,
